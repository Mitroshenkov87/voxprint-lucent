name: Bug
description: Lucent did not do what the docs describe
title: ""
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The line printed by `voxprint-lucent --version`.
      placeholder: 0.1.0 RC · build N "…"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Windows 11
        - Windows Server 2025
        - Linux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The file type helps (JPEG, WebP, AVIF, JPEG XL, and so on).
    validations:
      required: true

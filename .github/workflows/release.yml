name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Qt 6.12 and vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:/Qt/6.12.0
            C:/vcpkg/installed
            C:/vcpkg/downloads
            C:/vcpkg/packages
          key: m0-win-qt-6.12.0-vcpkg-libavif-dav1d-libjxl-v1
          restore-keys: |
            m0-win-qt-6.12.0-vcpkg-
      - name: Build the viewer, plugins, and tools tree
        run: pwsh -File packaging/windows/build-m0-harness.ps1
      - name: Build the per-machine MSI
        env:
          LUCENT_RELEASE_TAG: ${{ github.ref_name }}
        run: pwsh -File packaging/windows/build-release.ps1
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.msi
            dist/voxprint-lucent-*-win-x64.zip
          if-no-files-found: error

  linux:
    name: Linux package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Qt 6.12
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lucent-qt
          key: qt-6.12.0-linux-gcc_64-qtbase-icu-imageformats-v1
      - name: Compiler and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libx11-6 libx11-xcb1 libxcb1 \
            libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libxcb-xinerama0 libxext6 libxi6 libxrender1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Build the .deb
        env:
          LUCENT_RELEASE_TAG: ${{ github.ref_name }}
        run: sh packaging/linux/build-release.sh
      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*.deb
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: SHA256SUMS and pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          assets="${RUNNER_TEMP}/lucent-assets"
          mkdir -p "$assets"
          find dist -type f \( -name '*.msi' -o -name '*.zip' -o -name '*.deb' \) -exec cp {} "$assets/" \;
          (
            cd "$assets"
            sha256sum ./* | sed 's| \./| |' > SHA256SUMS
          )
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          body="${RUNNER_TEMP}/release-body.md"
          if [ -f "$notes" ]; then
            cp "$notes" "$body"
          else
            printf 'VOXPrint AI Lucent %s\n' "$GITHUB_REF_NAME" > "$body"
          fi
          {
            printf '\n## Checksums\n\n```\n'
            cat "$assets/SHA256SUMS"
            printf '```\n'
          } >> "$body"
          codename=$(sed -n 's/.*"codename" *: *"\([^"]*\)".*/\1/p' BUILD.json)
          build_n=$(sed -n 's/.*"number" *: *\([0-9][0-9]*\).*/\1/p' BUILD.json)
          if [ -z "$build_n" ]; then
            build_n=$(sed -n 's/.*"offset" *: *\([0-9][0-9]*\).*/\1/p' BUILD.json)
          fi
          title="0.1.0 RC · build ${build_n} \"${codename}\""
          set -- release create "$GITHUB_REF_NAME" \
            --title "$title" \
            --notes-file "$body" \
            --repo "${GITHUB_REPOSITORY}"
          case "$GITHUB_REF_NAME" in
            *-*) set -- "$@" --prerelease ;;
          esac
          gh "$@" "$assets"/*

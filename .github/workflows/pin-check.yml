# Reusable voxprint-common pin check.
# The suite pins voxprint-common by git tag and records the tag's commit in
# share/voxprint-common.pin.json. This job fails when pyproject.toml, the pin
# file, or the tag on the remote disagree with the wanted tag and commit.
name: voxprint-common pin

on:
  workflow_call:
    inputs:
      tag:
        description: Wanted voxprint-common tag, such as v0.8.0
        required: true
        type: string
      commit:
        description: Commit the tag must point to
        required: true
        type: string

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Fail when the pin disagrees with the tag's commit
        run: python scripts/check_common_pin.py --tag "${{ inputs.tag }}" --commit "${{ inputs.commit }}"

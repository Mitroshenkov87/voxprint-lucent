name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "bench/**"
      - "cpp/**"
      - "packaging/**"
      - "pyproject.toml"
      - "share/**"
      - "tests/**"
      - "voxprint_lucent/**"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint and test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libx11-6 libx11-xcb1 libxcb1 \
            libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libxcb-xinerama0 libxext6 libxi6 libxrender1 \
            libvulkan1 mesa-vulkan-drivers xvfb libgl1-mesa-dri
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Tests
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x720x24" python -m pytest

  cpp-smoke:
    name: C++ smoke (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Qt 6.12
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lucent-qt
          key: qt-6.12.0-linux-gcc_64-qtbase-icu-v1
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ hashFiles('cpp/**', 'packaging/linux/build-cpp-smoke.sh') }}
          restore-keys: |
            ccache-linux-
      - name: Compiler and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libx11-6 libx11-xcb1 libxcb1 \
            libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libxcb-xinerama0 libxext6 libxi6 libxrender1 \
            libvulkan1 mesa-vulkan-drivers xvfb libgl1-mesa-dri
      - name: Build against Qt 6.12 and require FIRST_PIXEL
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: sh packaging/linux/build-cpp-smoke.sh

  qt68:
    name: Qt 6.8 build (Debian 13)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build in a Debian 13 container
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/src -w /src debian:trixie \
            bash -eux -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config qt6-base-dev qt6-base-private-dev libgl1-mesa-dev libvulkan-dev libxkbcommon-dev && cmake -S cpp -B /tmp/build-qt68 -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build /tmp/build-qt68'

  benchmark:
    name: benchmark (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         startsWith(github.ref, 'refs/tags/v') ||
         startsWith(github.ref, 'refs/tags/release')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libx11-6 libx11-xcb1 libxcb1 \
            libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libxcb-xinerama0 libxext6 libxi6 libxrender1 \
            libvulkan1 mesa-vulkan-drivers xvfb libgl1-mesa-dri
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Benchmark (Linux)
        if: runner.os == 'Linux'
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x720x24" python -m bench.harness --runs 10
      - name: Benchmark (Windows)
        if: runner.os == 'Windows'
        run: python -m bench.harness --runs 10
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-benchmark-${{ matrix.os }}
          path: bench/results/latest.json
          if-no-files-found: ignore

  package:
    name: package (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         startsWith(github.ref, 'refs/tags/v') ||
         startsWith(github.ref, 'refs/tags/release')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Debian package
        if: runner.os == 'Linux'
        run: sh packaging/linux/build-deb.sh
      - name: WiX per-user MSI
        if: runner.os == 'Windows'
        run: pwsh -File packaging/windows/build-installer.ps1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  m0-harness:
    name: M0 Windows harness
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         startsWith(github.ref, 'refs/tags/v') ||
         startsWith(github.ref, 'refs/tags/release')))
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Qt 6.12 and vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:/Qt/6.12.0
            C:/vcpkg/installed
            C:/vcpkg/downloads
            C:/vcpkg/packages
          key: m0-win-qt-6.12.0-vcpkg-libavif-dav1d-libjxl-v1
          restore-keys: |
            m0-win-qt-6.12.0-vcpkg-
      - name: Build the self-contained zip
        run: pwsh -File packaging/windows/build-m0-harness.ps1
      - name: Upload lucent-m0-windows.zip
        uses: actions/upload-artifact@v4
        with:
          name: lucent-m0-windows
          path: dist/lucent-m0-windows.zip
          if-no-files-found: error

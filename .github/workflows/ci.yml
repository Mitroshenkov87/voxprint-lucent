name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "bench/**"
      - "cpp/**"
      - "packaging/**"
      - "pyproject.toml"
      - "scripts/**"
      - "share/**"
      - "tests/**"
      - "voxprint_lucent/**"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    name: voxprint-common pin
    uses: ./.github/workflows/pin-check.yml
    with:
      tag: v0.8.0
      commit: ab7f1a04095cd998a590963649be69e4ee11a246

  lint-test:
    name: lint and test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libx11-6 libx11-xcb1 libxcb1 \
            libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libxcb-xinerama0 libxext6 libxi6 libxrender1 \
            libvulkan1 mesa-vulkan-drivers xvfb libgl1-mesa-dri
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Doxygen and docs site
        run: |
          sudo apt-get install -y --no-install-recommends doxygen
          python -m pip install -e ".[docs]"
          mkdir -p build/doxygen
          doxygen Doxyfile
          python -m mkdocs build --strict
      - name: Tests
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x720x24" python -m pytest

  cpp-smoke:
    name: C++ smoke (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Qt 6.12
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/lucent-qt
          key: qt-6.12.0-linux-gcc_64-qtbase-icu-v1
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ hashFiles('cpp/**', 'packaging/linux/build-cpp-smoke.sh') }}
          restore-keys: |
            ccache-linux-
      - name: Compiler and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libx11-6 libx11-xcb1 libxcb1 \
            libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libxcb-xinerama0 libxext6 libxi6 libxrender1 \
            libvulkan1 mesa-vulkan-drivers xvfb libgl1-mesa-dri
      - name: Build against Qt 6.12 and record FIRST_PIXEL
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: sh packaging/linux/build-cpp-smoke.sh

  qt68:
    name: Qt 6.8 build (Debian 13)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build in a Debian 13 container
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/src -w /src debian:trixie \
            bash -eux -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config qt6-base-dev qt6-base-private-dev libgl1-mesa-dev libvulkan-dev libxkbcommon-dev && cmake -S cpp -B /tmp/build-qt68 -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build /tmp/build-qt68'

  benchmark:
    name: benchmark (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libx11-6 libx11-xcb1 libxcb1 \
            libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libxcb-xinerama0 libxext6 libxi6 libxrender1 \
            libvulkan1 mesa-vulkan-drivers xvfb libgl1-mesa-dri
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Benchmark (Linux)
        if: runner.os == 'Linux'
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x720x24" python -m bench.harness --runs 10
      - name: Benchmark (Windows)
        if: runner.os == 'Windows'
        run: python -m bench.harness --runs 10
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m0-benchmark-${{ matrix.os }}
          path: bench/results/latest.json
          if-no-files-found: ignore

  linux-installer:
    name: Linux installer (deb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Cache Qt 6.12
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/lucent-qt
          key: qt-6.12.0-linux-gcc_64-qtbase-icu-imageformats-v1
      - name: Compiler, codecs and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libavif-dev libjxl-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libx11-6 libx11-xcb1 libxcb1 \
            libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libxext6 libxi6 libxrender1
      - name: Build the .deb
        run: sh packaging/linux/build-release.sh
      - name: Smoke test (install, offscreen launch, WebP/AVIF/JXL/JPEG)
        run: sh packaging/linux/smoke-deb.sh dist/voxprint-lucent_*_amd64.deb --install
      - name: Upload the .deb
        uses: actions/upload-artifact@v7
        with:
          name: voxprint-lucent-linux-deb
          path: dist/*.deb
          if-no-files-found: error

  # Lucent-only Windows exception (RULEBOOK 3). Not a required check.
  windows-installer:
    name: Windows installer (MSI, not required)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Cache Qt 6.12 and vcpkg
        uses: actions/cache@v6
        with:
          path: |
            C:/Qt/6.12.0
            C:/vcpkg/installed
            C:/vcpkg/downloads
            C:/vcpkg/packages
          key: m0-win-qt-6.12.0-vcpkg-libavif-dav1d-libjxl-v1
          restore-keys: |
            m0-win-qt-6.12.0-vcpkg-
      - name: PowerShell 7
        shell: pwsh
        run: if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'pwsh 7 is required' }
      - name: Build the viewer, plugins, and Python helper tree
        shell: pwsh
        run: pwsh -File packaging/windows/build-m0-harness.ps1
      - name: Build the per-machine MSI
        shell: pwsh
        run: pwsh -File packaging/windows/build-release.ps1
      - name: Smoke test (silent install, offscreen launch, WebP/AVIF/JXL/JPEG, uninstall)
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist -Filter 'voxprint-lucent-setup-*-win-x64.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI not found in dist' }
          pwsh -File packaging/windows/smoke-msi.ps1 -Msi $msi.FullName
      - name: Upload the MSI
        uses: actions/upload-artifact@v7
        with:
          name: voxprint-lucent-windows-msi
          path: dist/voxprint-lucent-setup-*-win-x64.msi
          if-no-files-found: error
